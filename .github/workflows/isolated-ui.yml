name: Run 19 isolated UI cases

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed public repository commit SHA
        type: string
        required: true
      confirmation:
        description: Type RUN_ONCE_AFTER_PUBLICATION_REVIEW
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: isolated-ui-one-device
  cancel-in-progress: false

jobs:
  isolated-ui:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'origest/AutoAccounting-ui-tests' &&
      !github.event.repository.private &&
      github.run_attempt == 1 &&
      inputs.expected_commit == github.sha &&
      inputs.confirmation == 'RUN_ONCE_AFTER_PUBLICATION_REVIEW'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out reviewed public harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify scope before running repository scripts
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 -B - <<'PY'
          # BOOTSTRAP_BEGIN
          """Hash-bound flat-upload harness bootstrap; does not execute extracted code."""
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import tempfile
          import zipfile
          
          SCRIPT_NAMES = {
              'archive_safety.py', 'bootstrap.py', 'kvm_access.py', 'manifest_audit.py',
              'public_evidence.py', 'result_parser.py', 'run_ui.py', 'safe_scratch.py',
              'source_contract.py', 'test_archive_safety.py', 'test_bootstrap.py',
              'test_kvm_access.py', 'test_manifest_audit.py', 'test_public_contract.py',
              'test_public_evidence.py', 'test_result_parser.py', 'test_safe_scratch.py',
              'test_source_contract.py', 'owned_runtime.py', 'test_owned_runtime.py',
              'test_kvm_diagnostics.py', 'test_diagnostic_evidence.py',
              'progress_parser.py', 'progress_capture.py', 'test_progress_capture.py',
              'test_progress_parser.py',
          }
          EXPECTED_FILES = {'runtime-lock.json', 'expected-tests.json'} | {'scripts/'+n for n in SCRIPT_NAMES}
          
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError('Duplicate config key')
                  result[key] = value
              return result
          
          
          def bootstrap(workspace, runner_temp, expected_hash, expected_size):
              workspace = Path(workspace)
              runner_temp = Path(runner_temp)
              for directory in (workspace, runner_temp):
                  st = directory.lstat()
                  if (not stat.S_ISDIR(st.st_mode) or directory.resolve() != directory
                          or st.st_uid != os.getuid()): raise ValueError('Unsafe bootstrap directory')
              if not re.fullmatch('[0-9a-f]{64}', expected_hash): raise ValueError('Invalid harness pin')
              bundle = workspace/'harness.zip'
              st = bundle.lstat()
              if (not stat.S_ISREG(st.st_mode) or st.st_nlink != 1 or st.st_uid != os.getuid()
                      or st.st_size != expected_size or not 0 < st.st_size <= 512*1024):
                  raise ValueError('Invalid harness archive')
              raw = bundle.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_hash: raise ValueError('Harness hash mismatch')
              for name in ('scripts', 'runtime-lock.json', 'expected-tests.json'):
                  if os.path.lexists(workspace/name): raise ValueError('Harness destination already exists')
              stage = Path(tempfile.mkdtemp(prefix='aa-harness-bootstrap-', dir=runner_temp))
              names, total = set(), 0
              # BytesIO keeps the checked bytes bound to extraction, with no path reopening.
              from io import BytesIO
              with zipfile.ZipFile(BytesIO(raw)) as archive:
                  entries = archive.infolist()
                  for info in entries:
                      name = info.filename
                      p = PurePosixPath(name)
                      mode = info.external_attr >> 16
                      if (info.orig_filename != name or '\x00' in info.orig_filename or name not in EXPECTED_FILES
                              or p.is_absolute() or str(p) != name or '\\' in name
                              or '..' in p.parts or '.' in name.split('/') or name in names
                              or info.is_dir() or stat.S_IFMT(mode) not in (0, stat.S_IFREG)
                              or info.flag_bits & 1): raise ValueError('Unsafe harness member')
                      total += info.file_size
                      if info.file_size > 128*1024 or total > 2*1024*1024: raise ValueError('Oversized harness')
                      names.add(name)
                  if names != EXPECTED_FILES: raise ValueError('Incomplete harness')
                  for info in entries:
                      target = stage/info.filename
                      target.parent.mkdir(mode=0o700, exist_ok=True)
                      data = archive.read(info)
                      if len(data) != info.file_size: raise ValueError('Harness size mismatch')
                      with target.open('xb') as out: out.write(data)
                      target.chmod(0o600)
              cfg = json.loads((stage/'runtime-lock.json').read_text(), object_pairs_hook=unique_object)
              if (cfg.get('publication_review') != 'approved'
                      or cfg.get('repository') != 'origest/AutoAccounting-ui-tests'
                      or cfg['repository'] != os.environ['GITHUB_REPOSITORY']
                      or cfg.get('public_scope') != 'source-only-no-apk'
                      or cfg.get('temporary_kvm_uid_acl_authorized') is not True):
                  raise ValueError('Unapproved harness scope')
              for name in ('scripts', 'runtime-lock.json', 'expected-tests.json'):
                  if os.path.lexists(workspace/name): raise ValueError('Harness destination appeared')
                  os.rename(stage/name, workspace/name)
              stage.rmdir()
          # BOOTSTRAP_END
          try:
              bootstrap(Path.cwd(), Path(os.environ['RUNNER_TEMP']), 'ed17b3954155434e86017f262dd09772d8a09b1426f9e27d7d4923f216067881', 96794)
          except Exception:
              print('Harness bootstrap rejected; no repository script was executed.')
              raise SystemExit(1)
          PY
      - name: Check harness parser locally
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build reviewed source and run one unrooted emulator
        timeout-minutes: 26
        run: python3 -B scripts/run_ui.py
      - name: Verify restoration of temporary KVM access
        timeout-minutes: 1
        if: always() && steps.scope.outcome == 'success'
        run: python3 -B scripts/kvm_access.py
      - name: Publish validated synthetic status only
        timeout-minutes: 1
        if: always() && steps.scope.outcome == 'success'
        run: python3 -B scripts/public_evidence.py
