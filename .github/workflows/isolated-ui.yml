name: Run 19 isolated UI cases

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed public repository commit SHA
        type: string
        required: true
      confirmation:
        description: Type RUN_ONCE_AFTER_PUBLICATION_REVIEW
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: isolated-ui-one-device
  cancel-in-progress: false

jobs:
  isolated-ui:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'origest/AutoAccounting-ui-tests' &&
      !github.event.repository.private &&
      github.run_attempt == 1 &&
      inputs.expected_commit == github.sha &&
      inputs.confirmation == 'RUN_ONCE_AFTER_PUBLICATION_REVIEW'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out reviewed public harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify scope before running repository scripts
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 -B - <<'PY'
          # BOOTSTRAP_BEGIN
          """Hash-bound flat-upload harness bootstrap; does not execute extracted code."""
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import tempfile
          import zipfile
          
          SCRIPT_NAMES = {
              'archive_safety.py', 'bootstrap.py', 'kvm_access.py', 'manifest_audit.py',
              'public_evidence.py', 'result_parser.py', 'run_ui.py', 'safe_scratch.py',
              'source_contract.py', 'test_archive_safety.py', 'test_bootstrap.py',
              'test_kvm_access.py', 'test_manifest_audit.py', 'test_public_contract.py',
              'test_public_evidence.py', 'test_result_parser.py', 'test_safe_scratch.py',
              'test_source_contract.py',
          }
          EXPECTED_FILES = {'runtime-lock.json', 'expected-tests.json'} | {'scripts/'+n for n in SCRIPT_NAMES}
          
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError('Duplicate config key')
                  result[key] = value
              return result
          
          
          def bootstrap(workspace, runner_temp, expected_hash, expected_size):
              workspace = Path(workspace)
              runner_temp = Path(runner_temp)
              for directory in (workspace, runner_temp):
                  st = directory.lstat()
                  if (not stat.S_ISDIR(st.st_mode) or directory.resolve() != directory
                          or st.st_uid != os.getuid()): raise ValueError('Unsafe bootstrap directory')
              if not re.fullmatch('[0-9a-f]{64}', expected_hash): raise ValueError('Invalid harness pin')
              bundle = workspace/'harness.zip'
              st = bundle.lstat()
              if (not stat.S_ISREG(st.st_mode) or st.st_nlink != 1 or st.st_uid != os.getuid()
                      or st.st_size != expected_size or not 0 < st.st_size <= 512*1024):
                  raise ValueError('Invalid harness archive')
              raw = bundle.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_hash: raise ValueError('Harness hash mismatch')
