      - name: One approved temporary UID-only KVM grant and synthetic test
        env:
          QA_APPROVED_SHA: ${{ inputs.approved_sha }}
          QA_ACCEPT_SDK_LICENSES: ${{ inputs.accept_sdk_licenses && 'YES' || 'NO' }}
        run: |
          set -euo pipefail
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            # Reject nonstandard ACL rather than expanding another principal's effective rights.
            test "$(getfacl -cpn /dev/kvm)" = "$(printf 'user::rw-\ngroup::rw-\nother::---')"
            before=$(mktemp)
            getfacl --absolute-names /dev/kvm > "$before"
            cleanup() {
              status=$?
              trap - EXIT
              if ! sudo setfacl --restore="$before"; then
                echo 'KVM ACL restore failed; preserve local backup and fail the job' >&2
                exit 125
              fi
              if ! diff -u "$before" <(getfacl --absolute-names /dev/kvm); then
                echo 'KVM ACL restore readback mismatch; preserve backup and fail' >&2
                exit 126
              fi
              echo 'KVM ACL restored and readback verified'
              rm -f "$before"
              exit "$status"
            }
            trap cleanup EXIT
            sudo setfacl --no-mask -m "u:$(id -u):rw,m::rw" /dev/kvm
            test "$(getfacl -cpn /dev/kvm)" = "$(printf 'user::rw-\nuser:%s:rw-\ngroup::rw-\nmask::rw-\nother::---' "$(id -u)")"
            echo 'Temporary current-UID-only KVM ACL verified' 
          fi
          test -r /dev/kvm && test -w /dev/kvm
          cd qa/local-sync-v7
          # Must fail if source hashes/signing inputs or emulator-only gates do not match.
          bash ./run-device.sh
# No upload-artifact, cache, package/release upload, retry dispatch or paid fallback.
