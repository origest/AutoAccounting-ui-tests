# Harness and runner code are prepared; no device run has validated the orchestration.
name: Local copy v7 isolated device QA
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed commit SHA authorized for this one run
        required: true
        type: string
      accept_sdk_licenses:
        description: Confirm Android SDK terms explicitly approved for this run (developer.android.com/studio/terms)
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: local-copy-v7-one-shot
  cancel-in-progress: false
jobs:
  device:
    if: ${{ github.run_attempt == 1 && github.sha == inputs.approved_sha && github.repository == 'origest/AutoAccounting-ui-tests' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.accept_sdk_licenses == true }} # One approved manual run at the reviewed exact commit; reruns refused
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Runtime public-repository safety gate
        env:
          EXPECTED_REPOSITORY: origest/AutoAccounting-ui-tests
          EVENT_PRIVATE: ${{ github.event.repository.private }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$EVENT_PRIVATE" = false
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          test -c /dev/kvm
          command -v setfacl
          test "$RUNNER_OS" = Linux
      - name: Checkout exact authorized public commit without credentials
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/origest/AutoAccounting-ui-tests.git qa
          git -C qa checkout --detach "$GITHUB_SHA"
          test "$(git -C qa rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify and unpack exact reviewed source archive
        run: |
          set -euo pipefail
          cd qa
          python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath

          def unpack(archive,root,expected_sha,allow):
              archive=Path(archive); root=Path(root).resolve()
              if archive.stat().st_size > 32*1024*1024: raise ValueError('archive too large')
              if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected_sha: raise ValueError('archive hash mismatch')
              target=root/'local-sync-v7'
              if os.path.lexists(target): raise ValueError('target already exists; refusing overwrite')
              payloads=[]
              with zipfile.ZipFile(archive) as z:
                  infos=z.infolist(); names=[i.filename for i in infos]
                  if len(names)!=92 or len(names)!=len(set(names)) or set(names)!=set(allow): raise ValueError('unexpected or duplicate members')
                  if sum(i.file_size for i in infos)>32*1024*1024: raise ValueError('unpacked size limit')
                  for i in infos:
                      name=i.filename; parts=PurePosixPath(name).parts; wanted=allow[name]
                      if '\\' in name or '\x00' in name or name.startswith('/') or name!=str(PurePosixPath(name)) or any(p in ('','.','..') for p in parts) or len(parts)<2 or parts[0]!='local-sync-v7': raise ValueError('unsafe path')
                      mode=i.external_attr>>16
                      if i.is_dir() or i.flag_bits&1 or i.create_system!=3 or not stat.S_ISREG(mode) or mode!=wanted['mode']: raise ValueError('unsafe type or mode')
                      if i.file_size!=wanted['size']: raise ValueError('member size mismatch')
                      data=z.read(i)
                      if len(data)!=wanted['size'] or hashlib.sha256(data).hexdigest()!=wanted['sha256']: raise ValueError('member hash mismatch')
                      payloads.append((name,data,mode))
              # No untrusted bytes are written before all members pass validation.
              target.mkdir()
              for name,data,mode in payloads:
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True)
                  with p.open('xb') as f:f.write(data)
                  p.chmod(stat.S_IMODE(mode))
              print('Verified and unpacked exactly 92 reviewed files')

          ALLOW=json.loads('{"local-sync-v7/README.md":{"mode":33188,"sha256":"05aa1785b7c55ca396b05a52875dcf0452db002eea990e76ff94261b55d6d029","size":1029},"local-sync-v7/UPSTREAM_SOURCE_LICENSE":{"mode":33188,"sha256":"6f7f73f9cadd5c8e7903281d5b6d9ec95eb9e0bded7ed68e4aeb8e0a085cea13","size":35216},"local-sync-v7/bundle-manifest.json":{"mode":33188,"sha256":"185db353907850f099f2d74a3f9baefee9585328191f32ad81a89d7a64d78ea0","size":11226},"local-sync-v7/frontend-source/index.html":{"mode":33188,"sha256":"7d58c627e2fc5548a571217238f515fdbcf75cfb34992d31cff9fa3aa6e2a821","size":394},"local-sync-v7/frontend-source/package-lock.json":{"mode":33188,"sha256":"d02947ca5ac365a2a3e485d6fce8d7716c5384679a8e84c7bec42cb9b27dd9d1","size":64671},"local-sync-v7/frontend-source/package.json":{"mode":33188,"sha256":"01033f0a28d3c25703141aa6fec1392432dbab001125c62783171380a63f2fbf","size":706},"local-sync-v7/frontend-source/src/Charts.tsx":{"mode":33188,"sha256":"4de515db1522aca72e3b78cf021ec9e000645ce89e0d3c4e7ef1e8a53480c14b","size":1001},"local-sync-v7/frontend-source/src/api.ts":{"mode":33188,"sha256":"73c722e7407c2492e2f7361df7e6f3c1bd055a6444fa92af0b8f405205a8abef","size":8228},"local-sync-v7/frontend-source/src/main.tsx":{"mode":33188,"sha256":"b6bf4c02f286c86ea8ff606b9cbc7754428bdfb4668518203280a674212c7cdf","size":52271},"local-sync-v7/frontend-source/src/styles.css":{"mode":33188,"sha256":"96b670f4174e4f2f4441ff4fb6ffc01809f62007a3098992c777ddd8e9673fb5","size":22575},"local-sync-v7/frontend-source/tsconfig.json":{"mode":33188,"sha256":"a9f0f3c68f993b1895edc113151b1ee3f3dacc3a84f08a064c2cdc511703b270","size":372},"local-sync-v7/frontend-source/vite.config.ts":{"mode":33188,"sha256":"65112ebf50951a3db7819e7070dedf76693237fa4c31c1118e7a1df87f9ccf47","size":543},"local-sync-v7/receiver/BUILD_STATUS.json":{"mode":33188,"sha256":"a0d796fce55b5feeedf392ef885b9f093f3ccca0039a68b3abb319add0c833b1","size":5549},"local-sync-v7/receiver/PUBLIC_FILES.txt":{"mode":33188,"sha256":"9dc19b