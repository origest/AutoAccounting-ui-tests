# LOCAL CANDIDATE ONLY. Publication and one exact-SHA dispatch require separate approval.
name: Minimal synthetic credential capability
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed commit containing this workflow
        required: true
        type: string
permissions: {}
jobs:
  capability:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'origest/AutoAccounting-ui-tests' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      inputs.expected_commit == github.sha &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One fixed synthetic credential and cleanup probe
        shell: /usr/bin/python3 -I -B -S {0}
        run: |
          import base64, hashlib, importlib.util, io, json, os, pathlib, sys, zipfile
          # All bytes are embedded reviewed generic source. No network/checkout/action.
          BLOB = ""
          SOURCE_SHA = "af6b024f05dc6282dd41c8189ddb58044ca76ce98005db94bd0b9d5c06dd58c4"
          BUNDLE_SHA = "4a277db3f2ac0a282d4b8e9a9b9dd0d4e0cc3be453e6fb48de7f19f15001e684"
          try:
              if os.getresuid() != (1001,1001,1001) or os.getresgid() != (1001,1001,1001):
                  raise ValueError()
              raw = base64.b64decode(BLOB, validate=True)
              if hashlib.sha256(raw).hexdigest() != BUNDLE_SHA: raise ValueError()
              root = pathlib.Path.cwd() / '.aa-credential-synthetic-probe'
              os.mkdir(root, 0o700)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  names = archive.namelist()
                  if len(names) != len(set(names)) or len(names) != 24: raise ValueError()
                  for name in names:
                      if '/' in name or name not in ['credential_contract.py', 'durable_once.py', 'execution_source.py', 'fixture_client.py', 'fixture_server.py', 'kvm_lease.py', 'launch_contract.py', 'launch_contract_host.py', 'outer_custody.py', 'owned_fixture.py', 'owned_runtime.py', 'peer_core.py', 'peer_parent.py', 'peer_worker.py', 'pinned_kvm.py', 'probe_bootstrap.py', 'probe_outer.py', 'probe_preflight.py', 'probe_worker.py', 'protocol.py', 'source-manifest.json', 'source_guard.py', 'tool_checks.py', 'workflow_entry.py']: raise ValueError()
                      content = archive.read(name)
                      if len(content) > 131072: raise ValueError()
                      fd = os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      with os.fdopen(fd, 'wb') as target: target.write(content)
              data = (root / 'source-manifest.json').read_bytes()
              if hashlib.sha256(data).hexdigest() != SOURCE_SHA: raise ValueError()
              items = {item['path']: item for item in json.loads(data)['files']}
              loader = (root / 'source_guard.py').read_bytes()
              if hashlib.sha256(loader).hexdigest() != items['source_guard.py']['sha256']: raise ValueError()
              spec = importlib.util.spec_from_loader('source_guard', loader=None)
              module = importlib.util.module_from_spec(spec)
              module.__file__ = str(root / 'source_guard.py'); sys.modules['source_guard'] = module
              exec(compile(loader, module.__file__, 'exec', dont_inherit=True), module.__dict__)
              module.configure(root, SOURCE_SHA)
          except BaseException:
              print('{"schema":1,"status":"BLOCK","reason":"SOURCE_OR_PLATFORM_GATE"}', flush=True)
              sys.exit(1)
          try:
              import workflow_entry
              result = workflow_entry.main()
          except BaseException:
              print('{"schema":1,"status":"UNKNOWN","reason":"ENTRY_OR_CLEANUP_UNKNOWN"}', flush=True)
              result = 1
          sys.exit(result)
